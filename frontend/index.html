<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mock Interview</title>
    <!-- Set the theme class before paint to avoid a flash. Defaults to light
         (the product default); honours an explicit stored choice. Keep in sync
         with MIGRATION_DEFAULT in src/contexts/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* light is the default — no class needed */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
